name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets-scan:
    uses: abhiman-erla/ci-templates/.github/workflows/secret-scan.yml@11abec65f0c86a0f95e32250f9656c4cbd628b1f # v1.2.0

  workflow-lint:
    uses: abhiman-erla/ci-templates/.github/workflows/workflow-lint.yml@11abec65f0c86a0f95e32250f9656c4cbd628b1f # v1.2.0

  java:
    # Unit tests plus Testcontainers integration tests (the runner has Docker).
    # Reports from target/surefire-reports and target/failsafe-reports are
    # uploaded when the build fails, as before.
    uses: abhiman-erla/ci-templates/.github/workflows/java-ci.yml@11abec65f0c86a0f95e32250f9656c4cbd628b1f # v1.2.0
    permissions:
      contents: read
    with:
      java-version: "21"
      artifact-name: test-reports

  ci-ok:
    if: always()
    needs: [secrets-scan, workflow-lint, java]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
